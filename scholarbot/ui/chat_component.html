<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScholarBot Chat</title>

    <!-- Google Fonts: DM Serif Display + DM Sans + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&family=DM+Serif+Display&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- React 18 -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

    <!-- Marked.js for Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Mermaid.js for Diagrams -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'loose' });
        });
    </script>

    <!-- Highlight.js for code syntax -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        /* ═══════════════════════════════════════════════════════════════════
           DESIGN TOKENS — from ui/tokens.py (editorial warm minimalism v3)
           ═══════════════════════════════════════════════════════════════════ */
        :root {
            /* Colors */
            --color-background: #FAF6F0;
            --color-surface: #F5EFEB;
            --color-surface-raised: #FDFCFA;
            --color-surface-overlay: #F5EFEB;
            --color-accent-dark: #2C2417;
            --color-walnut: #4A3728;
            --color-walnut-light: #5C4535;
            --color-walnut-muted: #7A6250;
            --color-primary: #8B6914;
            --color-primary-dark: #6D5010;
            --color-primary-light: #C49A3A;
            --color-secondary: #4A7C6F;
            --color-warning: #C49A3A;
            --color-error: #A84040;
            --color-info: #4A6B8A;
            --color-text-primary: #1C1814;
            --color-text-body: #3D3632;
            --color-text-muted: #8A7F74;
            --color-text-subtle: #B5A99E;
            --color-text-on-dark: #F5F0E8;
            --color-border: #EADFCF;
            --color-border-strong: #C5BAB0;
            --color-divider: #EAE2D8;
            --color-outline-focus: #8B6914;

            /* Typography */
            --font-serif: 'DM Serif Display', Georgia, serif;
            --font-sans: 'DM Sans', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', Consolas, monospace;

            /* Font Sizes */
            --text-2xs: 0.625rem;
            --text-xs: 0.6875rem;
            --text-sm: 0.75rem;
            --text-base: 0.875rem;
            --text-md: 0.9375rem;
            --text-lg: 1rem;
            --text-xl: 1.125rem;
            --text-2xl: 1.375rem;
            --text-3xl: 1.75rem;
            --text-4xl: 2.25rem;

            /* Spacing */
            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 20px;
            --space-6: 24px;
            --space-8: 32px;
            --space-10: 40px;
            --space-12: 48px;

            /* Radius */
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            --radius-pill: 20px;
            --radius-full: 9999px;

            /* Shadows */
            --shadow-sm: 0 1px 3px rgba(44,36,23,0.05), 0 1px 2px rgba(44,36,23,0.03);
            --shadow-md: 0 2px 8px rgba(44,36,23,0.07), 0 1px 3px rgba(44,36,23,0.04);
            --shadow-lg: 0 4px 16px rgba(44,36,23,0.09), 0 2px 6px rgba(44,36,23,0.05);

            /* Transitions */
            --transition-fast: 0.10s ease;
            --transition-base: 0.15s ease;
            --transition-normal: 0.20s ease;
            --transition-slow: 0.30s ease;

            /* Layout */
            --layout-content-max-width: 720px;
            --layout-chat-max-width: 660px;
        }

        /* ═══════════════════════════════════════════════════════════════════
           GLOBAL RESET
           ═══════════════════════════════════════════════════════════════════ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background: var(--color-background);
            color: var(--color-text-body);
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ═══════════════════════════════════════════════════════════════════
           CHAT CONTAINER
           ═══════════════════════════════════════════════════════════════════ */
        .chat-container {
            max-width: var(--layout-content-max-width);
            margin: 0 auto;
            padding: var(--space-6) var(--space-6) 100px;
            min-height: 60vh;
        }

        /* ═══════════════════════════════════════════════════════════════════
           MESSAGE ROW
           ═══════════════════════════════════════════════════════════════════ */
        .message-row {
            display: flex;
            gap: var(--space-3);
            margin-bottom: var(--space-5);
            align-items: flex-start;
            animation: slideIn 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            opacity: 0;
            animation-fill-mode: forwards;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-row.user {
            flex-direction: row-reverse;
        }

        /* Staggered animation for multiple messages */
        .message-row:nth-child(1) { animation-delay: 0ms; }
        .message-row:nth-child(2) { animation-delay: 60ms; }
        .message-row:nth-child(3) { animation-delay: 120ms; }
        .message-row:nth-child(n+4) { animation-delay: 180ms; }

        /* ═══════════════════════════════════════════════════════════════════
           AVATAR
           ═══════════════════════════════════════════════════════════════════ */
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--text-sm);
            flex-shrink: 0;
            margin-top: 3px;
            font-weight: 500;
            letter-spacing: -0.01em;
        }

        .avatar.bot {
            background: var(--color-walnut);
            color: var(--color-text-on-dark);
            font-family: var(--font-serif);
            font-size: 13px;
        }

        .avatar.user {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            color: var(--color-text-muted);
        }

        /* ═══════════════════════════════════════════════════════════════════
           MESSAGE CONTENT WRAPPER
           ═══════════════════════════════════════════════════════════════════ */
        .message-content {
            flex: 1;
            max-width: 68%;
        }

        .message-row.user .message-content {
            max-width: 72%;
        }

        /* ═══════════════════════════════════════════════════════════════════
           MESSAGE BUBBLE
           ═══════════════════════════════════════════════════════════════════ */
        .bubble {
            padding: 10px 14px;
            border-radius: var(--radius-lg);
            font-size: var(--text-base);
            line-height: 1.65;
            word-wrap: break-word;
            position: relative;
            transition: transform var(--transition-base), box-shadow var(--transition-base);
        }

        .bubble.bot {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            color: var(--color-text-body);
            border-radius: var(--radius-sm) var(--radius-lg) var(--radius-lg) var(--radius-lg);
            font-family: var(--font-serif);
            font-size: var(--text-base);
            line-height: 1.7;
        }

        .bubble.user {
            background: var(--color-surface-raised);
            border: 1px solid var(--color-border-strong);
            color: var(--color-text-primary);
            border-radius: var(--radius-lg) var(--radius-sm) var(--radius-lg) var(--radius-lg);
            font-family: var(--font-sans);
            box-shadow: var(--shadow-sm);
        }

        .bubble:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .bubble.user:hover {
            transform: translateY(1px);
            box-shadow: var(--shadow-sm);
        }

        /* Streaming cursor */
        .bubble.streaming {
            min-height: 40px;
        }

        .bubble.streaming::after {
            content: '▌';
            animation: blink 0.8s step-end infinite;
            margin-left: 2px;
            color: var(--color-walnut-muted);
            font-family: var(--font-mono);
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* Streaming pulse animation on container */
        .streaming-message {
            animation: streamingPulse 2s ease-in-out infinite;
        }

        @keyframes streamingPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }

        /* ═══════════════════════════════════════════════════════════════════
           MESSAGE ACTIONS
           ═══════════════════════════════════════════════════════════════════ */
        .message-actions {
            display: flex;
            gap: var(--space-2);
            margin-top: var(--space-2);
            opacity: 0;
            transition: opacity var(--transition-base);
            flex-wrap: wrap;
        }

        .message-row:hover .message-actions,
        .message-row:focus-within .message-actions {
            opacity: 1;
        }

        /* Always show on mobile */
        @media (max-width: 768px) {
            .message-actions {
                opacity: 1;
            }
        }

        .action-btn {
            background: transparent;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: 3px 8px;
            font-size: var(--text-xs);
            color: var(--color-text-muted);
            cursor: pointer;
            transition: all var(--transition-base);
            font-family: var(--font-sans);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            line-height: 1.4;
            white-space: nowrap;
        }

        .action-btn:hover {
            background: var(--color-surface-overlay);
            border-color: var(--color-border-strong);
            color: var(--color-text-primary);
            transform: translateY(-1px);
        }

        .action-btn:active {
            transform: translateY(0) scale(0.96);
        }

        .action-btn.copied {
            background: var(--color-secondary);
            color: white;
            border-color: var(--color-secondary);
        }

        /* Reaction buttons */
        .reaction-btn {
            background: transparent;
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            padding: 2px 6px;
            font-size: var(--text-xs);
            cursor: pointer;
            transition: all var(--transition-base);
            font-family: var(--font-sans);
            opacity: 0;
            color: var(--color-text-subtle);
        }

        .message-row:hover .reaction-btn,
        .reaction-btn.active {
            opacity: 1;
        }

        .reaction-btn:hover {
            background: var(--color-surface);
            border-color: var(--color-border);
            transform: scale(1.15);
        }

        .reaction-btn.active {
            color: var(--color-primary);
            border-color: var(--color-primary);
            background: rgba(139, 105, 20, 0.08);
        }

        @media (max-width: 768px) {
            .reaction-btn {
                opacity: 0.7;
            }
        }

        /* ═══════════════════════════════════════════════════════════════════
           TYPING INDICATOR
           ═══════════════════════════════════════════════════════════════════ */
        .typing-indicator {
            display: flex;
            gap: var(--space-3);
            align-items: flex-start;
            margin-bottom: var(--space-5);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .typing-dots {
            display: flex;
            gap: 5px;
            align-items: center;
            padding: 12px 16px;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm) var(--radius-lg) var(--radius-lg) var(--radius-lg);
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--color-walnut-muted);
            animation: bounce 1.3s ease-in-out infinite;
        }

        .dot:nth-child(1) { animation-delay: 0s; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.5;
            }
            30% {
                transform: translateY(-6px);
                opacity: 1;
            }
        }

        /* ═══════════════════════════════════════════════════════════════════
           TIMESTAMP
           ═══════════════════════════════════════════════════════════════════ */
        .timestamp {
            font-size: var(--text-2xs);
            color: var(--color-text-subtle);
            margin-top: var(--space-1);
            font-family: var(--font-sans);
            letter-spacing: 0.02em;
        }

        .message-row.user .timestamp {
            text-align: right;
        }

        /* ═══════════════════════════════════════════════════════════════════
           MARKDOWN CONTENT
           ═══════════════════════════════════════════════════════════════════ */
        .markdown-content {
            line-height: 1.7;
        }

        .markdown-content p {
            margin-bottom: 0.75em;
        }

        .markdown-content p:last-child {
            margin-bottom: 0;
        }

        .markdown-content h1,
        .markdown-content h2,
        .markdown-content h3 {
            margin-top: 1.1em;
            margin-bottom: 0.4em;
            font-family: var(--font-serif);
            color: var(--color-text-primary);
            line-height: 1.3;
            letter-spacing: -0.02em;
        }

        .markdown-content h1 { font-size: 1.4em; }
        .markdown-content h2 { font-size: 1.2em; }
        .markdown-content h3 { font-size: 1.05em; }

        .markdown-content h1:first-child,
        .markdown-content h2:first-child,
        .markdown-content h3:first-child {
            margin-top: 0;
        }

        .markdown-content ul,
        .markdown-content ol {
            margin-left: 1.5em;
            margin-bottom: 0.75em;
        }

        .markdown-content li {
            margin-bottom: 0.3em;
        }

        .markdown-content li > ul,
        .markdown-content li > ol {
            margin-top: 0.25em;
            margin-bottom: 0;
        }

        .markdown-content code {
            background: rgba(44, 36, 23, 0.06);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: 1px 5px;
            font-family: var(--font-mono);
            font-size: 0.85em;
            color: var(--color-text-primary);
        }

        .markdown-content pre {
            background: var(--color-surface-raised);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: var(--space-4);
            overflow-x: auto;
            margin: 0.85em 0;
        }

        .markdown-content pre code {
            background: none;
            border: none;
            padding: 0;
            font-size: 0.8em;
            line-height: 1.6;
            color: var(--color-text-primary);
        }

        .markdown-content blockquote {
            border-left: 3px solid var(--color-border-strong);
            padding-left: var(--space-4);
            margin: 0.85em 0;
            color: var(--color-text-muted);
            font-style: italic;
        }

        .markdown-content blockquote p {
            margin-bottom: 0;
        }

        .markdown-content a {
            color: var(--color-primary);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color var(--transition-base);
        }

        .markdown-content a:hover {
            border-bottom-color: var(--color-primary);
        }

        .markdown-content strong {
            font-weight: 600;
            color: var(--color-text-primary);
        }

        .markdown-content em {
            font-style: italic;
        }

        .markdown-content hr {
            border: none;
            border-top: 1px solid var(--color-border);
            margin: 1.5em 0;
        }

        /* Inline code within lists */
        .markdown-content li code {
            font-size: 0.82em;
        }

        /* ═══════════════════════════════════════════════════════════════════
           SCROLL TO BOTTOM BUTTON
           ═══════════════════════════════════════════════════════════════════ */
        .scroll-to-bottom {
            position: fixed;
            bottom: 88px;
            right: 24px;
            width: 40px;
            height: 40px;
            background: var(--color-walnut);
            color: var(--color-text-on-dark);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-md);
            transition: all var(--transition-base);
            opacity: 0;
            pointer-events: none;
            z-index: 100;
            font-size: 16px;
        }

        .scroll-to-bottom.visible {
            opacity: 1;
            pointer-events: all;
        }

        .scroll-to-bottom:hover {
            background: var(--color-walnut-light);
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .scroll-to-bottom:active {
            transform: translateY(0);
        }

        /* ═══════════════════════════════════════════════════════════════════
           CUSTOM SCROLLBAR
           ═══════════════════════════════════════════════════════════════════ */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--color-border);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--color-border-strong);
        }

        /* Firefox */
        * {
            scrollbar-width: thin;
            scrollbar-color: var(--color-border) transparent;
        }

        /* ═══════════════════════════════════════════════════════════════════
           SKELETON LOADING
           ═══════════════════════════════════════════════════════════════════ */
        .skeleton-bubble {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: 14px 18px;
            min-height: 48px;
            position: relative;
            overflow: hidden;
        }

        .skeleton-line {
            background: linear-gradient(
                90deg,
                var(--color-border) 0%,
                var(--color-surface-raised) 50%,
                var(--color-border) 100%
            );
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 3px;
            margin-bottom: 8px;
            height: 14px;
        }

        .skeleton-line:last-child {
            margin-bottom: 0;
            width: 60%;
        }

        .skeleton-line:nth-child(1) { animation-delay: 0ms; width: 100%; }
        .skeleton-line:nth-child(2) { animation-delay: 150ms; width: 90%; }
        .skeleton-line:nth-child(3) { animation-delay: 300ms; width: 75%; }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ═══════════════════════════════════════════════════════════════════
           MESSAGE REGENERATE BUTTON
           ═══════════════════════════════════════════════════════════════════ */
        .regenerate-container {
            display: flex;
            justify-content: center;
            margin-bottom: var(--space-4);
        }

        .regenerate-btn {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-pill);
            padding: 6px 16px;
            font-size: var(--text-sm);
            color: var(--color-text-muted);
            cursor: pointer;
            transition: all var(--transition-base);
            font-family: var(--font-sans);
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
        }

        .regenerate-btn:hover {
            background: var(--color-surface-overlay);
            border-color: var(--color-border-strong);
            color: var(--color-text-primary);
            transform: translateY(-1px);
        }

        .regenerate-btn:active {
            transform: translateY(0);
        }

        .regenerate-btn.loading {
            opacity: 0.7;
            pointer-events: none;
        }

        /* ═══════════════════════════════════════════════════════════════════
           RESPONSIVE
           ═══════════════════════════════════════════════════════════════════ */
        @media (max-width: 768px) {
            .chat-container {
                padding: var(--space-4) var(--space-3) 120px;
            }

            .message-content {
                max-width: 82%;
            }

            .message-row.user .message-content {
                max-width: 85%;
            }

            .bubble {
                font-size: var(--text-sm);
            }

            .scroll-to-bottom {
                bottom: 80px;
                right: 12px;
                width: 36px;
                height: 36px;
                font-size: 14px;
            }

            .avatar {
                width: 28px;
                height: 28px;
                font-size: 11px;
            }
        }

        @media (max-width: 480px) {
            .chat-container {
                padding: var(--space-3) var(--space-2) 140px;
            }

            .message-row {
                gap: var(--space-2);
            }

            .bubble {
                padding: 8px 12px;
                font-size: 0.8125rem;
            }

            .action-btn {
                padding: 2px 6px;
                font-size: 0.625rem;
            }
        }

        /* ═══════════════════════════════════════════════════════════════════
           ACCESSIBILITY
           ═══════════════════════════════════════════════════════════════════ */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Focus visible for keyboard navigation */
        .action-btn:focus-visible,
        .regenerate-btn:focus-visible,
        .scroll-to-bottom:focus-visible {
            outline: 2px solid var(--color-outline-focus);
            outline-offset: 2px;
        }

        /* ═══════════════════════════════════════════════════════════════════
           CODE BLOCK TOOLBAR
           ═══════════════════════════════════════════════════════════════════ */
        .code-block-wrapper {
            position: relative;
            margin: 0.85em 0;
        }

        .code-block-wrapper pre {
            margin: 0;
            padding-top: 32px;
        }

        .code-lang-label {
            position: absolute;
            top: 8px;
            left: 14px;
            font-size: var(--text-2xs);
            color: var(--color-text-subtle);
            font-family: var(--font-mono);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // ═══════════════════════════════════════════════════════════════════
        // MARKDOWN RENDERER — with code block toolbar
        // ═══════════════════════════════════════════════════════════════════
        function MarkdownContent({ content }) {
            const ref = useRef(null);

            const htmlContent = useMemo(() => {
                if (!content) return '';

                marked.setOptions({
                    breaks: true,
                    gfm: true,
                });

                let html = marked.parse(content);

                // Handle Mermaid blocks first
                html = html.replace(
                    /<pre><code class="language-mermaid">([\s\S]*?)<\/code><\/pre>/g,
                    '<div class="mermaid-diagram-wrapper" style="background:#FDFCFA; padding:16px; border-radius:12px; margin: 16px 0; border: 1px solid #EADFCF; overflow-x:auto; display:flex; justify-content:center;"><div class="mermaid">$1</div></div>'
                );

                // Wrap remaining code blocks with language labels
                html = html.replace(
                    /<pre><code class="language-(\w+)">/g,
                    '<div class="code-block-wrapper"><span class="code-lang-label">$1</span><pre><code class="language-$1">'
                );
                html = html.replace(/<\/code><\/pre>/g, '</code></pre></div>');

                return html;
            }, [content]);

            // Highlight code blocks after render
            useEffect(() => {
                if (ref.current) {
                    ref.current.querySelectorAll('pre code').forEach((block) => {
                        hljs.highlightElement(block);
                    });
                    
                    if (window.mermaid) {
                        try {
                            window.mermaid.init(undefined, ref.current.querySelectorAll('.mermaid'));
                        } catch (e) {
                            console.error("Mermaid error:", e);
                        }
                    }
                }
            }, [htmlContent]);

            return (
                <div
                    ref={ref}
                    className="markdown-content"
                    dangerouslySetInnerHTML={{ __html: htmlContent }}
                />
            );
        }

        // ═══════════════════════════════════════════════════════════════════
        // REACTION SYSTEM
        // ═══════════════════════════════════════════════════════════════════
        const REACTIONS = [
            { emoji: '👍', label: 'Berguna' },
            { emoji: '👎', label: 'Kurang berguna' },
            { emoji: '🎯', label: 'Tepat' },
            { emoji: '💡', label: 'Ide baru' },
        ];

        function ReactionBar({ messageId, onReact }) {
            return (
                <div className="reaction-bar" style={{ display: 'flex', gap: '4px', marginTop: '4px' }}>
                    {REACTIONS.map((r) => (
                        <button
                            key={r.emoji}
                            className="reaction-btn"
                            onClick={() => onReact(messageId, r.emoji)}
                            title={r.label}
                            aria-label={r.label}
                        >
                            {r.emoji}
                        </button>
                    ))}
                </div>
            );
        }

        // ═══════════════════════════════════════════════════════════════════
        // MESSAGE ACTIONS
        // ═══════════════════════════════════════════════════════════════════
        function MessageActions({ content, onCopy }) {
            const [copied, setCopied] = useState(false);

            const handleCopy = useCallback(() => {
                navigator.clipboard.writeText(content).then(() => {
                    setCopied(true);
                    onCopy && onCopy();
                    setTimeout(() => setCopied(false), 2000);
                }).catch(() => {
                    // Fallback for older browsers
                    const textarea = document.createElement('textarea');
                    textarea.value = content;
                    textarea.style.position = 'fixed';
                    textarea.style.opacity = '0';
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                });
            }, [content, onCopy]);

            const handleCopyCode = useCallback(() => {
                // Extract code from markdown content
                const codeMatch = content.match(/```[\w]*\n([\s\S]*?)```/);
                const code = codeMatch ? codeMatch[1] : content;
                navigator.clipboard.writeText(code).then(() => {
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                });
            }, [content]);

            return (
                <div className="message-actions">
                    <button
                        className={`action-btn ${copied ? 'copied' : ''}`}
                        onClick={handleCopy}
                        aria-label={copied ? 'Copied' : 'Copy message'}
                    >
                        {copied ? '✓' : '📋'} {copied ? 'Copied' : 'Copy'}
                    </button>
                    {content.includes('```') && (
                        <button
                            className="action-btn"
                            onClick={handleCopyCode}
                            aria-label="Copy code"
                        >
                            📄 Copy Code
                        </button>
                    )}
                </div>
            );
        }

        // ═══════════════════════════════════════════════════════════════════
        // CHAT MESSAGE
        // ═══════════════════════════════════════════════════════════════════
        function ChatMessage({ message, isBot, isStreaming, onReact, messageIndex }) {
            return (
                <div
                    className={`message-row ${isBot ? 'bot' : 'user'} ${isStreaming ? 'streaming-message' : ''}`}
                    style={{ animationDelay: `${Math.min(messageIndex * 60, 300)}ms` }}
                    role="article"
                    aria-label={`${isBot ? 'ScholarBot' : 'User'} message`}
                >
                    <div className={`avatar ${isBot ? 'bot' : 'user'}`} aria-hidden="true">
                        {isBot ? (
                            <svg style={{width: '18px', height: '18px', stroke: 'currentColor', strokeWidth: '2', fill: 'none', strokeLinecap: 'round', strokeLinejoin: 'round'}} viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
                                <path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5" />
                            </svg>
                        ) : 'U'}
                    </div>
                    <div className="message-content">
                        <div
                            className={`bubble ${isBot ? 'bot' : 'user'} ${isStreaming ? 'streaming' : ''}`}
                        >
                            {isBot ? (
                                <MarkdownContent content={message.content} />
                            ) : (
                                <div>{message.content}</div>
                            )}
                        </div>
                        {message.time && (
                            <div className="timestamp" aria-label={`Sent at ${message.time}`}>
                                {message.time}
                            </div>
                        )}
                        {isBot && !isStreaming && (
                            <>
                                <MessageActions content={message.content} />
                                <ReactionBar messageId={message.id} onReact={onReact} />
                            </>
                        )}
                    </div>
                </div>
            );
        }

        // ═══════════════════════════════════════════════════════════════════
        // TYPING INDICATOR
        // ═══════════════════════════════════════════════════════════════════
        function TypingIndicator() {
            return (
                <div
                    className="typing-indicator"
                    role="status"
                    aria-label="ScholarBot is typing"
                    aria-live="polite"
                >
                    <div className="avatar bot" aria-hidden="true">
                        <svg style={{width: '18px', height: '18px', stroke: 'currentColor', strokeWidth: '2', fill: 'none', strokeLinecap: 'round', strokeLinejoin: 'round'}} viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
                            <path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5" />
                        </svg>
                    </div>
                    <div className="typing-dots">
                        <div className="dot" aria-hidden="true"></div>
                        <div className="dot" aria-hidden="true"></div>
                        <div className="dot" aria-hidden="true"></div>
                    </div>
                </div>
            );
        }

        // ═══════════════════════════════════════════════════════════════════
        // REGENERATE BUTTON
        // ═══════════════════════════════════════════════════════════════════
        function RegenerateButton({ onRegenerate, isLoading }) {
            return (
                <div className="regenerate-container">
                    <button
                        className={`regenerate-btn ${isLoading ? 'loading' : ''}`}
                        onClick={onRegenerate}
                        disabled={isLoading}
                        aria-label="Regenerate last response"
                    >
                        {isLoading ? '⟳ Generating...' : '↻ Regenerate'}
                    </button>
                </div>
            );
        }

        // ═══════════════════════════════════════════════════════════════════
        // SKELETON MESSAGE
        // ═══════════════════════════════════════════════════════════════════
        function SkeletonMessage() {
            return (
                <div className="message-row bot" role="status" aria-label="Loading message">
                    <div className="avatar bot" aria-hidden="true">
                        <svg style={{width: '18px', height: '18px', stroke: 'currentColor', strokeWidth: '2', fill: 'none', strokeLinecap: 'round', strokeLinejoin: 'round'}} viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
                            <path d="M6 12v5c0 2 2 3 6 3s6-1 6-3v-5" />
                        </svg>
                    </div>
                    <div className="message-content">
                        <div className="skeleton-bubble">
                            <div className="skeleton-line"></div>
                            <div className="skeleton-line"></div>
                            <div className="skeleton-line"></div>
                        </div>
                    </div>
                </div>
            );
        }

        // ═══════════════════════════════════════════════════════════════════
        // SCROLL TO BOTTOM BUTTON
        // ═══════════════════════════════════════════════════════════════════
        function ScrollToBottomButton({ onClick, visible }) {
            return (
                <button
                    className={`scroll-to-bottom ${visible ? 'visible' : ''}`}
                    onClick={onClick}
                    aria-label="Scroll to bottom"
                    aria-hidden={!visible}
                >
                    ↓
                </button>
            );
        }

        // ═══════════════════════════════════════════════════════════════════
        // AUTO-SAVE INDICATOR
        // ═══════════════════════════════════════════════════════════════════
        function SaveIndicator({ saved }) {
            const [show, setShow] = useState(false);

            useEffect(() => {
                if (saved) {
                    setShow(true);
                    const timer = setTimeout(() => setShow(false), 2000);
                    return () => clearTimeout(timer);
                }
            }, [saved]);

            if (!show) return null;

            return (
                <div
                    style={{
                        position: 'fixed',
                        bottom: '16px',
                        left: '50%',
                        transform: 'translateX(-50%)',
                        background: 'var(--color-walnut)',
                        color: 'var(--color-text-on-dark)',
                        padding: '6px 14px',
                        borderRadius: 'var(--radius-pill)',
                        fontSize: 'var(--text-xs)',
                        fontFamily: 'var(--font-sans)',
                        zIndex: 200,
                        animation: 'fadeIn 0.2s ease',
                        pointerEvents: 'none',
                    }}
                    role="status"
                    aria-live="polite"
                >
                    ✓ Tersimpan
                </div>
            );
        }

        // ═══════════════════════════════════════════════════════════════════
        // MAIN CHAT CONTAINER
        // ═══════════════════════════════════════════════════════════════════
        function ChatContainer({
            messages,
            isTyping,
            streamingMessageId,
            onRegenerate,
            isRegenerating,
            onReact,
            onCopyMessage,
        }) {
            const containerRef = useRef(null);
            const bottomRef = useRef(null);
            const [showScrollButton, setShowScrollButton] = useState(false);
            const [saved, setSaved] = useState(false);
            const prevMessagesLength = useRef(messages.length);

            // Scroll to bottom on initial mount
            useEffect(() => {
                setTimeout(() => scrollToBottom(false), 50);
            }, []);

            // Scroll to bottom when messages change
            useEffect(() => {
                if (messages.length > prevMessagesLength.current) {
                    scrollToBottom(true);
                }
                prevMessagesLength.current = messages.length;
            }, [messages.length]);

            // Scroll when typing starts
            useEffect(() => {
                if (isTyping) {
                    setTimeout(() => scrollToBottom(true), 150);
                }
            }, [isTyping]);

            // Scroll when streaming updates
            useEffect(() => {
                if (streamingMessageId) {
                    setTimeout(() => scrollToBottom(false), 50);
                }
            }, [streamingMessageId]);

            const scrollToBottom = useCallback((smooth = true) => {
                if (bottomRef.current) {
                    bottomRef.current.scrollIntoView({
                        behavior: smooth ? 'smooth' : 'auto',
                        block: 'end',
                    });
                }
                setShowScrollButton(false);
            }, []);

            // Detect scroll position for scroll button visibility
            useEffect(() => {
                const handleScroll = () => {
                    const scrollHeight = document.documentElement.scrollHeight;
                    const scrollTop = document.documentElement.scrollTop;
                    const clientHeight = window.innerHeight;
                    const distanceFromBottom = scrollHeight - scrollTop - clientHeight;

                    setShowScrollButton(distanceFromBottom > 200);
                };

                window.addEventListener('scroll', handleScroll, { passive: true });
                handleScroll();
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            // Keyboard shortcut: Escape to scroll to bottom
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape' && showScrollButton) {
                        scrollToBottom(true);
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [showScrollButton, scrollToBottom]);

            // Notify parent when message is copied
            const handleCopy = useCallback((messageId) => {
                onCopyMessage && onCopyMessage(messageId);
                setSaved(true);
                setTimeout(() => setSaved(false), 2500);
            }, [onCopyMessage]);

            // Initial mount animation
            const [mounted, setMounted] = useState(false);
            useEffect(() => {
                setMounted(true);
            }, []);

            if (!mounted) {
                return (
                    <div className="chat-container">
                        <SkeletonMessage />
                    </div>
                );
            }

            return (
                <>
                    <div className="chat-container" ref={containerRef}>
                        {/* Show regenerate button if there are messages */}
                        {messages.length > 0 && messages[messages.length - 1]?.role === 'assistant' && (
                            <RegenerateButton
                                onRegenerate={onRegenerate}
                                isLoading={isRegenerating}
                            />
                        )}

                        {/* Message list */}
                        {messages.map((msg, index) => (
                            <ChatMessage
                                key={msg.id || `msg-${index}`}
                                message={msg}
                                isBot={msg.role === 'assistant'}
                                isStreaming={msg.id === streamingMessageId}
                                onReact={onReact}
                                messageIndex={index}
                            />
                        ))}

                        {/* Typing indicator */}
                        {isTyping && !streamingMessageId && <TypingIndicator />}

                        {/* Bottom anchor */}
                        <div ref={bottomRef} style={{ height: '1px' }} />
                    </div>

                    {/* Scroll to bottom button */}
                    <ScrollToBottomButton
                        onClick={() => scrollToBottom(true)}
                        visible={showScrollButton}
                    />

                    {/* Save indicator */}
                    <SaveIndicator saved={saved} />
                </>
            );
        }

        // ═══════════════════════════════════════════════════════════════════
        // DATA INJECTION FROM STREAMLIT
        // ═══════════════════════════════════════════════════════════════════
        const initialMessages = window.STREAMLIT_MESSAGES || [];
        const initialTyping = window.STREAMLIT_IS_TYPING || false;
        const streamingMessageId = window.STREAMLIT_STREAMING_ID || null;
        const componentKey = window.STREAMLIT_KEY || 'chat-default';
        const isRegenerating = window.STREAMLIT_REGENERATING || false;

        // ═══════════════════════════════════════════════════════════════════
        // RENDER
        // ═══════════════════════════════════════════════════════════════════
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ChatContainer
                messages={initialMessages}
                isTyping={initialTyping}
                streamingMessageId={streamingMessageId}
                onRegenerate={() => {
                    if (window.StreamlitChatBridge && window.StreamlitChatBridge.onRegenerate) {
                        window.StreamlitChatBridge.onRegenerate();
                    }
                }}
                isRegenerating={isRegenerating}
                onReact={(messageId, emoji) => {
                    if (window.StreamlitChatBridge && window.StreamlitChatBridge.onReact) {
                        window.StreamlitChatBridge.onReact(messageId, emoji);
                    }
                }}
                onCopyMessage={(messageId) => {
                    if (window.StreamlitChatBridge && window.StreamlitChatBridge.onCopy) {
                        window.StreamlitChatBridge.onCopy(messageId);
                    }
                }}
            />
        );

        // Signal that component is ready
        window.StreamlitChatReady = true;
    </script>
</body>
</html>
